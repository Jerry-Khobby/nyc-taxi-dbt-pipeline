version: 2

models:
  - name: stg_taxi_zones
    description: Taxi zone lookup, renamed and trimmed. One row per location_id.
    columns:
      - name: location_id
        description: TLC zone ID. Joins to pickup_location_id and dropoff_location_id.
        data_tests:
          - unique
          - not_null
      - name: borough
        description: NYC borough, or Unknown / N/A for the catch-all zones.
      - name: zone_name
        description: Zone name.
      - name: service_zone
        description: TLC service zone (Yellow Zone, Boro Zone, Airports, EWR).
      - name: loaded_at
        description: When the lookup was loaded into raw.

  - name: stg_yellow_trips
    description: >
      Yellow taxi trips, renamed, cast and cleaned with the valid_trip_filter
      macro, then deduplicated on trip_id. One row per trip.
    columns:
      - name: trip_id
        description: Surrogate key built from the trip's identifying columns.
        data_tests:
          - unique
          - not_null
      - name: vendor_id
        description: TPEP provider code.
      - name: pickup_at
        description: When the meter was engaged.
        data_tests:
          - not_null
      - name: dropoff_at
        description: When the meter was disengaged.
        data_tests:
          - not_null
      - name: passenger_count
        description: Driver-entered passenger count. Nulls are kept, not imputed.
      - name: trip_distance
        description: Trip distance in miles from the taximeter.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: "{{ var('max_trip_distance_miles') }}"
                inclusive: false
      - name: rate_code_id
        description: Rate code in effect at the end of the trip.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 99]
                quote: false
              config:
                severity: warn
                where: rate_code_id is not null
      - name: is_store_and_forward
        description: True if the record was held in vehicle memory before sending.
      - name: pickup_location_id
        description: TLC zone where the meter was engaged.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_taxi_zones')
                field: location_id
              config:
                severity: warn
      - name: dropoff_location_id
        description: TLC zone where the meter was disengaged.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_taxi_zones')
                field: location_id
              config:
                severity: warn
      - name: payment_type_id
        description: How the passenger paid. Tips are only recorded for card payments (1).
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6]
                quote: false
              config:
                severity: warn
      - name: fare_amount
        description: Time-and-distance fare from the meter.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: extra_amount
        description: Miscellaneous extras and surcharges.
      - name: mta_tax_amount
        description: MTA tax.
      - name: tip_amount
        description: Tip amount. Card tips only; cash tips are not recorded.
      - name: tolls_amount
        description: Tolls paid.
      - name: improvement_surcharge_amount
        description: Improvement surcharge.
      - name: congestion_surcharge_amount
        description: NYS congestion surcharge.
      - name: airport_fee_amount
        description: Fee for pickups at LaGuardia and JFK.
      - name: cbd_congestion_fee_amount
        description: MTA Congestion Relief Zone fee. Null before 2025.
      - name: total_amount
        description: Total charged to the passenger, excluding cash tips.
      - name: source_file
        description: Monthly file the row was loaded from.
      - name: source_month
        description: First day of the month in source_file.
      - name: loaded_at
        description: When the row was loaded into raw.
