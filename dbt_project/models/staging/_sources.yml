version: 2

sources:
  - name: raw
    description: Raw NYC TLC data loaded as-is by the Airflow ingestion DAGs.
    schema: raw
    tables:
      - name: yellow_trips
        description: >
          Yellow taxi trip records, one Parquet file per month. Column names are
          lowercased at load time; nothing else is changed. source_file
          identifies the monthly file each row came from.
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 35, period: day}
            error_after: {count: 45, period: day}
        columns:
          - name: source_file
            data_tests:
              - not_null
          - name: tpep_pickup_datetime
            data_tests:
              - not_null

      - name: taxi_zones
        description: TLC taxi zone lookup. Replaced in full on each load.
        columns:
          - name: locationid
            data_tests:
              - not_null
